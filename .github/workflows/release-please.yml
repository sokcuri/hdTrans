name: Release main

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main push Build run ID to retry
        type: string
        required: true

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the release deploy key
        env:
          RELEASE_PUSH_KEY: ${{ secrets.HDTRANS_RELEASE_PUSH_KEY }}
        run: test -n "$RELEASE_PUSH_KEY"
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.HDTRANS_RELEASE_PUSH_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install release tooling
        run: npm --prefix tools/release ci --ignore-scripts --no-audit --no-fund
      - name: Persist the version and publish the release
        uses: actions/github-script@v8
        env:
          BUILD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { releaseMain } = await import(`${process.env.GITHUB_WORKSPACE}/tools/release/release.mjs`);
            await releaseMain({
              github, repo: context.repo, runId: process.env.BUILD_RUN_ID,
              token: process.env.GH_TOKEN, log: core.info
            });
