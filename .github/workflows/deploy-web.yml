name: Deploy web
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy web {0}{1}', inputs.tag, inputs.dry_run && ' (dry run)' || '') || format('Deploy web {0}', github.event.workflow_run.head_branch) }}

on:
  workflow_run:
    workflows: [Publish npm]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to deploy (v<major>.<minor>.<patch>)
        type: string
        required: true
      dry_run:
        description: Build the site and list what would change on the server without changing it
        type: boolean
        default: true
        required: true

permissions:
  contents: read

env:
  SITE_URL: https://trans.kuri.kr/

jobs:
  release:
    if: >-
      github.repository == 'sokcuri/hdTrans' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the published release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$RUN_TAG"
          if [[ "$EVENT" == workflow_dispatch ]]; then tag="$INPUT_TAG"; fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            if [[ "$EVENT" == workflow_dispatch ]]; then
              echo "::error::Select a v<major>.<minor>.<patch> release tag." >&2
              exit 1
            fi
            echo "::notice::$tag is not a stable release tag; nothing to deploy."
            echo deploy=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '"\(.draft) \(.prerelease)"')"
          if [[ "$state" != 'false false' ]]; then
            echo "::error::$tag has no published stable release." >&2
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$EVENT" == workflow_run ]]; then
            test "$sha" = "$RUN_SHA"
            if [[ "$latest" != "$tag" ]]; then
              echo "::notice::$tag is not the latest release ($latest); the site is left as it is."
              echo deploy=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [[ "$latest" != "$tag" ]]; then
            echo "::warning::$tag is older than the latest release $latest."
          fi
          { echo deploy=true; echo "tag=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: web
      url: ${{ env.SITE_URL }}
    concurrency:
      group: deploy-web${{ inputs.dry_run && '-dry-run' || '' }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.release.outputs.tag }}
      SHA: ${{ needs.release.outputs.sha }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release source
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          git merge-base --is-ancestor HEAD origin/main
          test "$(cat release-version.txt)" = "${TAG#v}"
          # This workflow's deploy script, so that older releases deploy with the current server commands.
          git checkout "$GITHUB_SHA" -- web/deploy.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install TypeScript tools
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      # The site uses the packages the tag pipeline built and tested: the Linux CLI
      # compiles the dictionary snapshot and the npm package holds the engine.
      - name: Download the release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir" build/linux build/wasm
          cli="hdTrans-$version-linux-x64.tar.gz"
          npm="hdTrans-$version-wasm.tgz"
          # Releases before 0.4.5 name the npm package hdtrans-<version>.tgz.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$npm"; then
            npm="hdtrans-$version.tgz"
          fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$dir" -p SHA256SUMS.txt -p "$cli" -p "$npm"
          for file in "$cli" "$npm"; do
            if ! grep -qxF "$(cd "$dir" && sha256sum "$file")" "$dir/SHA256SUMS.txt"; then
              echo "::error::$file does not match SHA256SUMS.txt of $TAG." >&2
              exit 1
            fi
          done
          tar -xzf "$dir/$cli" -C build/linux --strip-components=1 "hdTrans-$version/hdtrans"
          tar -xzf "$dir/$npm" -C build/wasm --strip-components=2 \
            package/dist/hdtrans_engine.js package/dist/hdtrans_engine.wasm
          rm -rf "$dir"
      - name: Check the engine version
        run: |
          engine="$(node --input-type=module - "$PWD/build/wasm" <<'JS'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const dir = process.argv[2];
          const { default: create } = await import(pathToFileURL(join(dir, 'hdtrans_engine.js')).href);
          const engine = await create({ wasmBinary: readFileSync(join(dir, 'hdtrans_engine.wasm')) });
          console.log(engine.version());
          JS
          )"
          if [[ "$engine" != "${TAG#v}" ]]; then
            echo "::error::The release engine reports version $engine, not ${TAG#v}." >&2
            exit 1
          fi
      - name: Set up SSH
        env:
          HDTRANS_WEB_HOST: ${{ secrets.HDTRANS_WEB_HOST }}
          DEPLOY_KEY: ${{ secrets.HDTRANS_WEB_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HDTRANS_WEB_KNOWN_HOSTS }}
        run: |
          test -n "$HDTRANS_WEB_HOST" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          dir="$RUNNER_TEMP/web-ssh"
          install -d -m 700 "$dir"
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$dir/key"; printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts")
          echo "HDTRANS_WEB_SSH=ssh -i $dir/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts -o ConnectTimeout=20" >> "$GITHUB_ENV"
      # Example texts that are not in the repository come from the deployed site;
      # they stay on this runner and are never uploaded as artifacts.
      - name: Fetch the example texts
        env:
          HDTRANS_WEB_HOST: ${{ secrets.HDTRANS_WEB_HOST }}
        run: web/deploy.sh examples "$RUNNER_TEMP/web-examples"
      - name: Build the site
        run: |
          chmod +x build/linux/hdtrans
          home="$(mktemp -d)"
          HOME="$home" HDTRANS_CACHE_DIR=off HDTRANS_CLI=build/linux/hdtrans HDTRANS_WASM=build/wasm \
            HDTRANS_WEB_EXAMPLES="$RUNNER_TEMP/web-examples" node web/build.mjs
          rm -rf "$home"
      - name: List the changes (dry run)
        if: env.DRY_RUN == 'true'
        env:
          HDTRANS_WEB_HOST: ${{ secrets.HDTRANS_WEB_HOST }}
        run: |
          web/deploy.sh dry-run > "$RUNNER_TEMP/dry-run.log"
          {
            echo "### Deploy web $TAG (dry run)"
            echo "Files whose content changes: $(grep -c '^<' "$RUNNER_TEMP/dry-run.log" || true)"
            echo "Files to delete: $(grep -c '^\*deleting' "$RUNNER_TEMP/dry-run.log" || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      # A newer release may have deployed while this one was building.
      - name: Confirm the release is still the latest
        if: env.DRY_RUN != 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest" != "$TAG" ]]; then
            echo "::notice::$TAG is no longer the latest release ($latest); the site is left as it is."
            echo SKIP_DEPLOY=true >> "$GITHUB_ENV"
          fi
      - name: Deploy
        if: env.DRY_RUN != 'true' && env.SKIP_DEPLOY != 'true'
        env:
          HDTRANS_WEB_HOST: ${{ secrets.HDTRANS_WEB_HOST }}
        run: web/deploy.sh
      - name: Check the live site
        if: env.DRY_RUN != 'true' && env.SKIP_DEPLOY != 'true'
        run: |
          live="$RUNNER_TEMP/live"
          mkdir -p "$live"
          get() { curl -fsS --compressed --retry 3 -H 'Cache-Control: no-cache' "$SITE_URL$1" -o "$2"; }
          for attempt in 1 2 3 4 5 6; do
            get "?deploy=$SHA" "$live/index.html" && cmp -s "$live/index.html" build/web/dist/index.html && break
            if [[ "$attempt" == 6 ]]; then echo "::error::The live page is not the page just built." >&2; exit 1; fi
            sleep 10
          done
          version="$(grep -o '<p class="contact" id="version">[^<]*</p>' "$live/index.html" | sed 's/<[^>]*>//g')"
          short="${version##*, }"
          if [[ "$version" != "hdTrans ${TAG#v}, "* || ${#short} -lt 7 || "$SHA" != "$short"* ]]; then
            echo "::error::The live version line ($version) is not $TAG at $SHA." >&2
            exit 1
          fi
          get manifest.json "$live/manifest.json"
          cmp "$live/manifest.json" build/web/dist/manifest.json
          get examples/list.json "$live/list.json"
          cmp "$live/list.json" build/web/dist/examples/list.json
          for asset in engine wasm; do
            get "$(jq -r ".$asset.path" build/web/dist/manifest.json)" "$live/$asset"
            cmp "$live/$asset" "build/wasm/$(jq -r ".$asset.name" build/web/dist/manifest.json)"
          done
          curl -fsSI --retry 3 "$SITE_URL$(jq -r .dict.snapshot.path build/web/dist/manifest.json)" > /dev/null
          {
            echo "### Deployed web $TAG"
            echo "$version"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key and example texts
        if: always()
        run: rm -rf "$RUNNER_TEMP/web-ssh" "$RUNNER_TEMP/web-examples" build/web/dist/examples
