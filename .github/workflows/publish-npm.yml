name: Publish npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rebuild packages without publishing the release or npm package
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable release tag
        uses: actions/github-script@v8
        with:
          script: |
            if (!/^refs\/tags\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(context.ref)) {
              throw new Error('Select a v<major>.<minor>.<patch> release tag.');
            }

  build:
    needs: validate
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      HDTRANS_TESTDATA_KEY: ${{ secrets.HDTRANS_TESTDATA_KEY }}

  publish:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-npm
      queue: max
      cancel-in-progress: false
    env:
      PACKAGE_DIR: build/npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source is on main
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: ${{ env.PACKAGE_DIR }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - name: Verify package and registry state
        id: package
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { verifyNpmPackage, npmPublication } from './tools/release/publication.mjs';
          const pkg = verifyNpmPackage({ packageDir: process.env.PACKAGE_DIR, ref: process.env.GITHUB_REF });
          const publication = await npmPublication(pkg);
          appendFileSync(process.env.GITHUB_OUTPUT,
            `path=${pkg.path}\nversion=${pkg.version}\nskip=${publication.skip}\ntag=${publication.tag}\n`);
          JS
      - name: Publish to npm with OIDC
        if: steps.package.outputs.skip != 'true'
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
          DIST_TAG: ${{ steps.package.outputs.tag }}
        run: npm publish "$PACKAGE" --access public --provenance --tag "$DIST_TAG"
      - name: Report npm release
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SKIPPED: ${{ steps.package.outputs.skip }}
          DIST_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if [[ "$SKIPPED" == true ]]; then
            echo "hdtrans@$VERSION already matches the validated package; publication skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published hdtrans@$VERSION using OIDC with dist-tag $DIST_TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
