name: Release packages

on:
  workflow_call:
    inputs:
      dry_run:
        description: Upload packages without publishing
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hdtrans-*
          path: build/artifacts
      - name: Compile the shared standalone dictionary
        run: |
          chmod +x build/artifacts/hdtrans-linux/hdtrans
          mkdir -p build/shared
          home="$(mktemp -d)"
          HOME="$home" HDTRANS_CACHE_DIR=off "$PWD/build/artifacts/hdtrans-linux/hdtrans" \
            --dicts "$PWD/dicts" --compile-snapshot "$PWD/build/shared/dicts.hdsnap"
          rm -rf "$home"
      - name: Make portable packages and checksums
        run: >-
          python3 -I tools/package-release.py --artifacts build/artifacts --output build/release
          --snapshot build/shared/dicts.hdsnap
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and test npm package
        run: |
          npm --prefix npm ci
          node tools/package-npm.mjs --snapshot build/shared/dicts.hdsnap \
            --wasm build/artifacts/hdtrans-wasm --wrapper build/artifacts/hdtrans-wasm/translator.js
          npm --prefix npm test
          npm pack ./npm --pack-destination build/release
          (cd build/release && sha256sum hdtrans-*.tgz >> SHA256SUMS.txt)
      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/release/*
          overwrite: true
          if-no-files-found: error
      - name: Report packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo '### Release packages'
            echo "Dry run: $DRY_RUN"
            echo '```text'
            cat build/release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: package
    if: >-
      !inputs.dry_run &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release
      - name: Read existing release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: context.ref.replace('refs/tags/', '')
              });
              require('fs').writeFileSync('build/release-notes.txt', release.data.body || '');
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: List changes since the previous tag
        if: steps.notes.outputs.exists != 'true'
        run: |
          previous="$(git describe --tags --exclude nightly --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          range="$GITHUB_SHA"
          if [[ -n "$previous" ]]; then range="$previous..$GITHUB_SHA"; fi
          {
            git log --merges --format='- %s' "$range"
            git log --no-merges --format='- %s' "$range"
          } > build/release-notes.txt
      - name: Move nightly and remove its old assets
        if: github.ref == 'refs/heads/develop'
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            try {
              await github.rest.git.updateRef({ ...repo, ref: 'tags/nightly', sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({ ...repo, ref: 'refs/tags/nightly', sha: context.sha });
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...repo, tag: 'nightly' })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) {
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...repo, release_id: release.id, per_page: 100
              });
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
              }
            }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/develop' && 'nightly' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/develop' && 'nightly' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref == 'refs/heads/develop' }}
          make_latest: ${{ github.ref == 'refs/heads/develop' && 'false' || 'true' }}
          body_path: build/release-notes.txt
          files: build/release/*
          fail_on_unmatched_files: true
