name: Release packages

on:
  workflow_call:
    inputs:
      dry_run:
        description: Upload packages without publishing
        type: boolean
        required: true
    outputs:
      release_published:
        description: A stable GitHub release was published successfully
        value: ${{ jobs.release.outputs.release_published }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: hdtrans-*
          path: build/artifacts
      - name: Compile the shared standalone dictionary
        run: |
          chmod +x build/artifacts/hdtrans-linux/hdtrans
          mkdir -p build/shared
          home="$(mktemp -d)"
          HOME="$home" HDTRANS_CACHE_DIR=off "$PWD/build/artifacts/hdtrans-linux/hdtrans" \
            --dicts "$PWD/dicts" --compile-snapshot "$PWD/build/shared/dicts.hdsnap"
          rm -rf "$home"
      - name: Make portable packages and checksums
        run: >-
          python3 -I tools/package-release.py --artifacts build/artifacts --output build/release
          --snapshot build/shared/dicts.hdsnap
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and test npm package
        run: |
          npm --prefix npm ci
          node tools/package-npm.mjs --snapshot build/shared/dicts.hdsnap \
            --wasm build/artifacts/hdtrans-wasm --wrapper build/artifacts/hdtrans-wasm/translator.js
          npm --prefix npm test
          npm pack ./npm --pack-destination build/release
          (cd build/release && sha256sum hdtrans-*.tgz >> SHA256SUMS.txt)
      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/release/*
          overwrite: true
          if-no-files-found: error
      - name: Report packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo '### Release packages'
            echo "Dry run: $DRY_RUN"
            echo '```text'
            cat build/release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: package
    if: >-
      !inputs.dry_run &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    outputs:
      release_published: ${{ steps.publish.outputs.release_published }}
    concurrency:
      group: github-release-${{ github.ref == 'refs/heads/develop' && 'nightly' || 'stable' }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify stable release source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release
      - name: Read existing release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        uses: actions/github-script@v8
        with:
          script: |
            const { findRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/release/publication.mjs`);
            const release = await findRelease(github, context.repo, context.ref.replace('refs/tags/', ''));
            if (release) {
              require('fs').writeFileSync('build/release-notes.txt', release.body || '');
              core.setOutput('exists', 'true');
            }
      - name: List changes since the previous tag
        if: steps.notes.outputs.exists != 'true'
        run: |
          previous="$(git describe --tags --exclude nightly --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          range="$GITHUB_SHA"
          if [[ -n "$previous" ]]; then range="$previous..$GITHUB_SHA"; fi
          {
            git log --merges --format='- %s' "$range"
            git log --no-merges --format='- %s' "$range"
          } > build/release-notes.txt
      - name: Upload assets and publish release
        id: publish
        uses: actions/github-script@v8
        with:
          script: |
            const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/release/publication.mjs`);
            const published = await publishRelease({
              github, repo: context.repo, ref: context.ref, sha: context.sha,
              packageDir: 'build/release', notes: require('fs').readFileSync('build/release-notes.txt', 'utf8')
            });
            core.setOutput('release_published', String(published));
