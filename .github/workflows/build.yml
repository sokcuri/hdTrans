name: Build
run-name: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('Release {0}', github.ref_name) || '' }}

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
    inputs:
      dry_run:
        description: Package artifacts without publishing a release
        type: boolean
        required: true
    secrets:
      HDTRANS_TESTDATA_KEY:
        required: false
    outputs:
      release_published:
        description: A stable GitHub release was published successfully
        value: ${{ jobs.release.outputs.release_published }}
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package artifacts without publishing a release
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 1G
  CCACHE_DIR: ${{ github.workspace }}/build/ccache
  CCACHE_MAXSIZE: 1G
  EMSDK_VERSION: 4.0.22
  HDTRANS_USER_FILES: hdtrans.config.example.yaml user/userdict.example.txt

jobs:
  # Skips the matrix for the release bot's version commit (the tag pipeline tests it) and for
  # a tree that a successful Build already tested. Tags and manual runs skip the steps, and a
  # failed step leaves no output: both build everything.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      tree: ${{ steps.gate.outputs.tree }}
      tested_by: ${{ steps.gate.outputs.tested_by }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        continue-on-error: true
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: tools/release
          persist-credentials: false
      - name: Decide what to build
        id: gate
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { buildGate } = await import(`${process.env.GITHUB_WORKSPACE}/tools/release/build-gate.mjs`);
            const gate = await buildGate({ github, context });
            core.info(`Build gate: ${gate.reason}`);
            await core.summary.addRaw(`Build gate: ${gate.reason}\n`).write();
            core.setOutput('run', String(gate.run));
            core.setOutput('tree', gate.tree);
            core.setOutput('tested_by', gate.testedBy ?? '');

  release-tools:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm --prefix tools/release ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tools/release test

  build:
    name: ${{ matrix.preset }}
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    permissions:
      contents: read
      # The performance budget downloads the linux build of a pull request's base commit.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        preset: [linux, windows-x64, windows-x86, mac, wasm]
    runs-on: ${{ startsWith(matrix.preset, 'windows-') && 'windows-latest' || matrix.preset == 'mac' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HAS_TESTDATA_KEY: ${{ matrix.preset == 'linux' && secrets.HDTRANS_TESTDATA_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Publishing requires a v<major>.<minor>.<patch> tag on main.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Set up MSVC for Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSVC_ARCH: ${{ matrix.preset == 'windows-x86' && 'amd64_x86' || 'x64' }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio installation not found' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $command = "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" $env:MSVC_ARCH >nul && set"
          $environment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'vcvarsall failed' }
          foreach ($line in $environment) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)
            if (!$before.ContainsKey($name) -or $before[$name] -cne $value) {
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
      # One Emscripten cache entry per version and runner, shared by every workflow.
      - name: Restore Emscripten
        id: emsdk-cache
        if: matrix.preset == 'wasm'
        uses: actions/cache/restore@v6
        with:
          path: build/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Emscripten
        if: matrix.preset == 'wasm' && steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/emsdk
          curl -fsSL --retry 3 "https://github.com/emscripten-core/emsdk/archive/refs/tags/$EMSDK_VERSION.tar.gz" |
            tar -xz -C build/emsdk
          mv "build/emsdk/emsdk-$EMSDK_VERSION" build/emsdk/emsdk-main
          build/emsdk/emsdk-main/emsdk install "$EMSDK_VERSION"
      - name: Save Emscripten
        if: >-
          matrix.preset == 'wasm' && steps.emsdk-cache.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request')
        uses: actions/cache/save@v6
        with:
          path: build/emsdk
          key: ${{ steps.emsdk-cache.outputs.cache-primary-key }}
      - name: Set up ccache for Emscripten
        if: matrix.preset == 'wasm'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          # Keep sysroot paths stable in both cold and restored compiler caches.
          sdk="$GITHUB_WORKSPACE/build/emsdk/emsdk-main"
          "$sdk/emsdk" activate "$EMSDK_VERSION"
          source "$sdk/emsdk_env.sh"
          {
            env | grep '^EMSDK'
            echo "EM_CONFIG=$sdk/.emscripten"
            # The Emscripten version identifies the compiler; restored files have other mtimes.
            echo "CCACHE_COMPILERCHECK=string:emsdk-$EMSDK_VERSION"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$sdk" "$sdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Set up Node for the WASM smoke test
        if: matrix.preset == 'wasm'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install TypeScript tools
        if: matrix.preset == 'wasm'
        run: npm --prefix web ci
      - name: Set up sccache
        if: matrix.preset != 'wasm'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true
      # Only develop and pull requests save compiler caches; main and tags read develop's.
      - name: Restore native compiler cache
        id: native-cache
        if: matrix.preset != 'wasm'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-
      - name: Restore WASM compiler cache
        id: wasm-cache
        if: matrix.preset == 'wasm'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-wasm-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-wasm-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-wasm-
      - name: Select parallelism
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            jobs="$NUMBER_OF_PROCESSORS"
          else
            jobs="$(getconf _NPROCESSORS_ONLN)"
          fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          if [[ "${{ matrix.preset }}" == wasm ]]; then
            # ccache accepts the -Xclang arguments in Emscripten's Clang calls.
            EM_COMPILER_WRAPPER=ccache emcmake cmake --preset wasm -G Ninja
            ccache --zero-stats
          elif [[ "$RUNNER_OS" == Windows ]]; then
            cmake --preset "${{ matrix.preset }}" -G Ninja -A "" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache
          else
            cmake --preset "${{ matrix.preset }}" -G Ninja \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache
          fi
      - name: Build CLI, libraries and tests
        id: compile
        env:
          EM_COMPILER_WRAPPER: ${{ matrix.preset == 'wasm' && 'ccache' || '' }}
        run: cmake --build --preset "${{ matrix.preset }}" --parallel "$BUILD_JOBS"
      - name: Build TypeScript API and check types
        if: matrix.preset == 'wasm'
        run: |
          npm --prefix web run compile
          npm --prefix web run test:types
          cp build/web/translator.js build/web/translator.d.ts build/wasm/
      - name: Stage data, examples and licences
        run: |
          root="build/${{ matrix.preset }}"
          printf '%s\n' "$RUNNER_ARCH" > "$root/ARCH"
          mkdir -p "$root/third_party/pcre2/deps/sljit" "$root/third_party/libyaml"
          cp THIRD-PARTY-NOTICES.txt "$root/"
          cp third_party/pcre2/LICENCE.md "$root/third_party/pcre2/"
          cp third_party/pcre2/deps/sljit/LICENSE "$root/third_party/pcre2/deps/sljit/"
          cp third_party/libyaml/License "$root/third_party/libyaml/"
          if [[ "${{ matrix.preset }}" != wasm ]]; then
            data="$root"
            if [[ "$RUNNER_OS" == Windows ]]; then data="$root/hdTrans"; fi
            mkdir -p "$data/user"
            home="$(mktemp -d)"
            HOME="$home" USERPROFILE="$home" HDTRANS_CACHE_DIR=off \
              "$PWD/$root/hdtrans${{ runner.os == 'Windows' && '.exe' || '' }}" \
              --dicts "$PWD/dicts" --compile-snapshot "$PWD/$data/dicts.hdsnap"
            rm -rf "$home"
            python3 -I - "$data/dicts.txt" <<'PY'
          import hashlib, json, pathlib, sys
          digest = hashlib.sha256()
          for path in sorted(pathlib.Path('dicts').glob('*.tsv'), key=lambda path: path.name.encode('utf-8')):
              digest.update(path.name.encode('utf-8') + b'\0' + path.read_bytes() + b'\0')
          version = json.loads(pathlib.Path('npm/package.json').read_text(encoding='utf-8'))['version']
          pathlib.Path(sys.argv[1]).write_text(f'{version}+{digest.hexdigest()[:12]}\n', encoding='utf-8')
          PY
            read -r -a userFiles <<< "$HDTRANS_USER_FILES"
            cp "${userFiles[@]}" "$data/user/"
          fi
      - name: Test without external fixtures
        run: |
          unset HDTRANS_REQUIRE_ALL HDTRANS_GOLDEN HDTRANS_DICTS HDTRANS_TEST_EXCLUDE
          if [[ "${{ matrix.preset }}" == wasm ]]; then
            HDTRANS_WASM_WRAPPER=build/wasm/translator.js \
              node --experimental-default-type=module tools/wasm_smoke.mjs \
              build/wasm/hdtrans_engine.js tests/unit/dict/testdata/folder/base.tsv \
              2>&1 | tee build/wasm/ctest.log
          else
            export HDTRANS_DICTS="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/dicts.hdsnap"
            if [[ "$RUNNER_OS" == Windows ]]; then
              export HDTRANS_DICTS="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/hdTrans/dicts.hdsnap"
            fi
            ctest --preset "${{ matrix.preset }}" --parallel "$BUILD_JOBS" --verbose \
              2>&1 | tee "build/${{ matrix.preset }}/ctest.log"
          fi
      - name: Check out the test data
        if: matrix.preset == 'linux' && env.HAS_TESTDATA_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: sokcuri/hdTrans-data
          ssh-key: ${{ secrets.HDTRANS_TESTDATA_KEY }}
          persist-credentials: false
          path: testdata
      - name: Skip unavailable expected data
        if: matrix.preset == 'linux' && env.HAS_TESTDATA_KEY != 'true'
        run: echo "::notice::HDTRANS_TESTDATA_KEY is not available; the expected-data comparison is skipped."
      - name: Compare with the expected outputs
        if: matrix.preset == 'linux' && env.HAS_TESTDATA_KEY == 'true'
        run: |
          home="$(mktemp -d "$RUNNER_TEMP/hdtrans-e2e-home.XXXXXX")"
          trap 'rm -rf "$home"' EXIT
          set +e
          HOME="$home" USERPROFILE="$home" tools/e2e.sh --expected testdata build/linux/hdtrans "$GITHUB_WORKSPACE/dicts" > "$RUNNER_TEMP/e2e.log" 2>&1
          status=$?
          grep -E '^[^ ]+: [0-9]+ changed lines?$|^e2e: ' "$RUNNER_TEMP/e2e.log"
          tail -n 1 "$RUNNER_TEMP/e2e.log" | grep '^e2e: ' >> "$GITHUB_STEP_SUMMARY"
          case $status in
            0) echo 'No translation changed.' >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo 'Translations changed; accept them in the test data once this is on main.' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          [ "$status" -le 1 ]
      # Instruction counts of fixed inputs under valgrind (tools/perf-budget.py, docs/build.md "CI"). On a
      # pull request the base commit's linux build is measured in the same run: downloaded
      # (tools/perf-base.py, waiting for a develop build in progress) or else built here. A count more
      # than 1% over it fails unless a commit carries a `Perf-Budget: <reason>` trailer. Everything
      # else, the comparison with tools/perf-budget.tsv and every push, is reported only.
      - name: Performance budget
        if: matrix.preset == 'linux'
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # The base branch commit this pull request build merged with: the first parent of the merge ref.
          BASE_SHA=
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then BASE_SHA=$(git rev-parse --verify -q HEAD^1); fi
          warn() {
            echo "::warning title=Performance budget::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          echo '### Performance budget' >> "$GITHUB_STEP_SUMMARY"
          if ! command -v valgrind > /dev/null; then
            sudo apt-get install -y -qq valgrind > /dev/null ||
              { sudo apt-get update -qq && sudo apt-get install -y -qq valgrind > /dev/null; }
          fi
          if ! command -v valgrind > /dev/null; then
            warn 'valgrind could not be installed; nothing was measured.'
            exit 0
          fi
          compilers() { readelf -p .comment "$1" 2> /dev/null | grep -F '[' | sed 's/^ *\[ *[0-9a-f]*\] *//' | sort -u; }
          build_base() {
            local src="$RUNNER_TEMP/base-src" home="$RUNNER_TEMP/base-home"
            git worktree add --detach "$src" "$BASE_SHA" > /dev/null || return 1
            mkdir -p "$home"
            if ! (cd "$src" && cmake --preset linux -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
                  -DCMAKE_C_COMPILER_LAUNCHER=sccache &&
                  cmake --build --preset linux --parallel "$BUILD_JOBS" --target hdtrans_cli &&
                  HOME="$home" HDTRANS_CACHE_DIR=off build/linux/hdtrans --dicts "$PWD/dicts" \
                    --compile-snapshot "$PWD/build/linux/dicts.hdsnap") > "$RUNNER_TEMP/base-build.log" 2>&1; then
              tail -n 40 "$RUNNER_TEMP/base-build.log"
              return 1
            fi
            rm -rf "$home"
            base="$src/build/linux"
          }
          args=(--check build/linux/hdtrans build/linux/dicts.hdsnap --out "$RUNNER_TEMP/perf-budget.tsv")
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
            base="$RUNNER_TEMP/base"
            if ! python3 -I tools/perf-base.py "$BASE_SHA" "$base" --wait 600; then
              base=
            elif [[ "$(compilers "$base/hdtrans")" != "$(compilers build/linux/hdtrans)" ]]; then
              echo "perf-base: the downloaded base build has another compiler"
              base=
            fi
            if [[ -z "$base" ]]; then
              echo "perf-base: building $BASE_SHA here"
              build_base || { base=; echo "perf-base: the base commit $BASE_SHA could not be built"; }
            fi
            if [[ -n "$base" ]]; then args+=(--against "$base/hdtrans" "$base/dicts.hdsnap"); fi
          fi
          python3 -I tools/perf-budget.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/perf-budget.log"
          status=${PIPESTATUS[0]}
          {
            echo '```text'
            cat "$RUNNER_TEMP/perf-budget.log"
            echo '```'
            if [[ -f "$RUNNER_TEMP/perf-budget.tsv" ]]; then
              echo 'Measured, as tools/perf-budget.tsv:'
              echo '```text'
              cat "$RUNNER_TEMP/perf-budget.tsv"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$BASE_SHA" ]] && grep -q 'reported only' "$RUNNER_TEMP/perf-budget.log"; then
            warn 'No base build was measured; the counts were only reported against tools/perf-budget.tsv.'
          fi
          case "$status" in
            0|1) exit "$status" ;;
            *) warn "The performance budget could not be measured (exit $status); nothing was compared." ;;
          esac
          exit 0
      # The counts of each develop push: the record that tools/perf-budget.tsv is copied from.
      - name: Upload the measured counts
        if: matrix.preset == 'linux' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: perf-budget
          path: ${{ runner.temp }}/perf-budget.tsv
          retention-days: 90
          if-no-files-found: ignore
      - name: Report fixture skips and test results
        if: always()
        run: |
          log="build/${{ matrix.preset }}/ctest.log"
          if [[ -f "$log" ]]; then
            {
              echo '### ${{ matrix.preset }} tests'
              echo '```text'
              grep -E 'SKIP |Skipped|PASS wasm smoke|[0-9]+ run, [0-9]+ failed, [0-9]+ skipped|tests passed' "$log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report compiler cache
        if: always()
        run: |
          mkdir -p "build/${{ matrix.preset }}"
          if [[ "${{ matrix.preset }}" == wasm ]]; then
            ccache --show-stats --verbose 2>&1 | tee "build/wasm/ccache.log"
          else
            sccache --show-stats 2>&1 | tee "build/${{ matrix.preset }}/sccache.log"
            {
              echo '### ${{ matrix.preset }} compiler cache'
              echo '```text'
              cat "build/${{ matrix.preset }}/sccache.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sccache --stop-server
          fi
      - name: Save native compiler cache
        if: >-
          !cancelled() && matrix.preset != 'wasm' && steps.compile.outcome == 'success' &&
          (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save WASM compiler cache
        if: >-
          !cancelled() && matrix.preset == 'wasm' && steps.compile.outcome == 'success' &&
          (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}
      - name: Upload CLI, GUI and libraries
        uses: actions/upload-artifact@v7
        with:
          name: hdtrans-${{ matrix.preset }}
          overwrite: true
          if-no-files-found: error
          path: |
            build/${{ matrix.preset }}/hdtrans-version.txt
            build/${{ matrix.preset }}/ARCH
            build/${{ matrix.preset }}/hdtrans${{ runner.os == 'Windows' && '.exe' || '' }}
            build/${{ matrix.preset }}/libhdTransCore.a
            build/${{ matrix.preset }}/libhdTransEngine.so
            build/${{ matrix.preset }}/libhdTransEngine.dylib
            build/${{ matrix.preset }}/hdTransGUI.exe
            build/${{ matrix.preset }}/hdTransCore.lib
            build/${{ matrix.preset }}/hdTransEngine.dll
            build/${{ matrix.preset }}/hdTransEngine.lib
            build/${{ matrix.preset }}/J2KEngine.dll
            build/${{ matrix.preset }}/J2KEngine.lib
            build/${{ matrix.preset }}/hdtrans_engine.js
            build/${{ matrix.preset }}/hdtrans_engine.wasm
            build/${{ matrix.preset }}/translator.js
            build/${{ matrix.preset }}/translator.d.ts
            build/${{ matrix.preset }}/hdTrans/
            build/${{ matrix.preset }}/dicts.hdsnap
            build/${{ matrix.preset }}/dicts.txt
            build/${{ matrix.preset }}/user/
            build/${{ matrix.preset }}/THIRD-PARTY-NOTICES.txt
            build/${{ matrix.preset }}/third_party/
      - name: Upload test and compiler-cache logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.preset }}
          overwrite: true
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/ctest.log
            build/${{ matrix.preset }}/sccache.log
            build/${{ matrix.preset }}/ccache.log

  # Records a develop tree whose matrix passed, or a develop→main merge tree that the gate
  # matched to one, for the gate of a later main push of the same tree. The gate accepts
  # only these records.
  tested:
    needs: [gate, release-tools, build]
    if: >-
      !cancelled() && needs.gate.outputs.tree != '' &&
      ((github.event_name == 'pull_request' && github.head_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/develop')) &&
      ((needs.gate.outputs.run == 'true' && needs.release-tools.result == 'success' && needs.build.result == 'success') ||
       (needs.gate.outputs.run == 'false' && needs.gate.outputs.tested_by != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Write the record
        env:
          TREE: ${{ needs.gate.outputs.tree }}
          TESTED_BY: ${{ needs.gate.outputs.tested_by }}
        run: |
          mkdir -p "$RUNNER_TEMP/tested"
          {
            echo "tree $TREE"
            echo "run $GITHUB_RUN_ID"
            echo "event $GITHUB_EVENT_NAME $GITHUB_REF $GITHUB_SHA"
            if [[ -n "$TESTED_BY" ]]; then echo "tested by run $TESTED_BY"; fi
          } > "$RUNNER_TEMP/tested/tested-tree.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ needs.gate.outputs.tree }}
          path: ${{ runner.temp }}/tested/tested-tree.txt
          retention-days: 30
          if-no-files-found: error

  sanitize:
    name: linux-asan
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      HDTRANS_CACHE_DIR: 'off'
      ASAN_OPTIONS: detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true
      - name: Restore sanitizer compiler cache
        id: asan-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ runner.arch }}-linux-asan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-linux-asan-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-linux-asan-
      - name: Configure
        run: |
          cmake --preset linux-asan -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache
      - name: Build
        id: compile
        run: cmake --build --preset linux-asan --parallel "$(getconf _NPROCESSORS_ONLN)"
      - name: Compile the dictionaries
        run: |
          home="$(mktemp -d)"
          HOME="$home" build/linux-asan/hdtrans --dicts "$PWD/dicts" --compile-snapshot "$RUNNER_TEMP/dicts.hdsnap"
          rm -rf "$home"
      - name: Unit tests and rule cases under the sanitizers
        run: |
          unset HDTRANS_REQUIRE_ALL HDTRANS_GOLDEN HDTRANS_TEST_EXCLUDE
          export HDTRANS_DICTS="$RUNNER_TEMP/dicts.hdsnap"
          ctest --preset linux-asan --parallel "$(getconf _NPROCESSORS_ONLN)" -R '^(unit|rules\.cases.*|examples)$' \
            2>&1 | tee build/linux-asan/ctest.log
      - name: Report sanitizer compiler cache
        if: always()
        run: |
          sccache --show-stats || true
          sccache --stop-server || true
      - name: Save sanitizer compiler cache
        if: >-
          !cancelled() && steps.compile.outcome == 'success' &&
          (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.asan-cache.outputs.cache-primary-key }}
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-linux-asan
          overwrite: true
          if-no-files-found: ignore
          path: build/linux-asan/ctest.log

  # libFuzzer on mutated text made from the repository's inputs (tools/fuzz.py, docs/build.md "CI").
  # Replaying the seeds and the kept regression inputs fails the job; what the random run finds fails
  # it on develop pushes and is reported on pull requests, main pushes and tags. A fuzzer that does
  # not build is reported: the other jobs compile the same sources.
  fuzz:
    name: linux-fuzz
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
      HDTRANS_CACHE_DIR: 'off'
      ASAN_OPTIONS: detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1
      FUZZ_BLOCKING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          disable_annotations: true
      - name: Restore fuzzer compiler cache
        id: fuzz-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ runner.arch }}-linux-fuzz-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-linux-fuzz-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-linux-fuzz-
      - name: Build the fuzzer
        id: build
        continue-on-error: true
        run: |
          cmake --preset linux-asan -B build/linux-fuzz -DHDTRANS_FUZZ=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache
          cmake --build build/linux-fuzz --target hdtrans_fuzz hdtrans_cli --parallel "$(getconf _NPROCESSORS_ONLN)"
          home="$(mktemp -d)"
          HOME="$home" build/linux-fuzz/hdtrans --dicts "$PWD/dicts" --compile-snapshot "$RUNNER_TEMP/dicts.hdsnap"
          rm -rf "$home"
      - name: Report a fuzzer that did not build
        if: steps.build.outcome == 'failure'
        run: |
          echo '::warning title=Fuzz::The fuzzer did not build; nothing was fuzzed.'
          echo 'The fuzzer did not build; nothing was fuzzed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Replay the seeds and regression inputs
        id: replay
        if: steps.build.outcome == 'success'
        timeout-minutes: 8
        run: |
          set +e
          timeout 7m python3 -I tools/fuzz.py build/linux-fuzz/hdtrans_fuzz "$RUNNER_TEMP/dicts.hdsnap" --replay \
            --out build/linux-fuzz/replay 2>&1 | tee "$RUNNER_TEMP/replay.txt"
          status=${PIPESTATUS[0]}
          {
            echo '### Replay'
            echo '```text'
            grep '^fuzz: \|^  text: \|^  hex: ' "$RUNNER_TEMP/replay.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Fuzz
        id: fuzz
        if: steps.replay.outcome == 'success'
        continue-on-error: ${{ env.FUZZ_BLOCKING != 'true' }}
        timeout-minutes: 8
        run: |
          set +e
          timeout 7m python3 -I tools/fuzz.py build/linux-fuzz/hdtrans_fuzz "$RUNNER_TEMP/dicts.hdsnap" --seconds 150 \
            --seed "$GITHUB_RUN_NUMBER" --out build/linux-fuzz/found 2>&1 | tee "$RUNNER_TEMP/fuzz.txt"
          status=${PIPESTATUS[0]}
          {
            echo '### Fuzz'
            echo '```text'
            grep '^fuzz: \|^  text: \|^  hex: ' "$RUNNER_TEMP/fuzz.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != 0 && "$FUZZ_BLOCKING" != true ]]; then
            echo '::warning title=Fuzz::The random fuzz run failed; the inputs are in the summary and the fuzz-findings artifact.'
          fi
          exit "$status"
      - name: Report fuzzer compiler cache
        if: always()
        run: |
          sccache --show-stats || true
          sccache --stop-server || true
      - name: Save fuzzer compiler cache
        if: >-
          !cancelled() && steps.build.outcome == 'success' &&
          (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.fuzz-cache.outputs.cache-primary-key }}
      - name: Upload the failing inputs and fuzzer logs
        if: always() && (steps.replay.outcome == 'failure' || steps.fuzz.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          overwrite: true
          if-no-files-found: ignore
          path: |
            build/linux-fuzz/replay/
            build/linux-fuzz/found/

  release:
    needs: [build, release-tools]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ inputs.dry_run || !startsWith(github.ref, 'refs/tags/v') }}
