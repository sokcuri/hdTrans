name: TwoControl runtime probe
run-name: TwoControl runtime probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: TwoControl runtime probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download, validate and prepare disposable application
        shell: pwsh
        run: python -I tools/twocontrol_probe/prepare.py "$env:RUNNER_TEMP/twocontrol-probe"
      - name: Run actual program and bundled plugin
        shell: pwsh
        run: ./tools/twocontrol_probe/run.ps1 -Root "$env:RUNNER_TEMP/twocontrol-probe"
      - name: Upload authored runtime evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twocontrol-runtime-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/twocontrol-probe/evidence/
